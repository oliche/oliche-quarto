<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" role="img" aria-label="Sync edge pairing diagram"><style>.w-n,.w-p{fill:none;stroke:#17202b;stroke-width:2}.w-miss{fill:none;stroke:#5a6573;stroke-width:2;stroke-dasharray:3 4}.start{stroke:#5a6573;stroke-width:1;stroke-dasharray:2 3}.pair-bad{stroke:#c23b32;stroke-width:1.6}.pair-ok{stroke:#2c7a4b;stroke-width:1.6}text{font-family:Menlo,monospace;fill:#5a6573;font-size:12px;paint-order:stroke;stroke:#fff;stroke-width:4px}.row{fill:#17202b;font-size:13px}.bad{fill:#c23b32}.ok{fill:#2c7a4b}.tick{font-size:10px}</style><rect width="740" height="220" fill="#fff"/><path d="M70,68 H105 V38 H175 V68 H245 V38 H315 V68 H385 V38 H455 V68 H525 V38 H595 V68 H665 V38 H700" class="w-n"/><path d="M70,128 H140" class="w-miss"/><path d="M140,128 H175 V158 H245 V128 H315 V158 H385 V128 H455 V158 H525 V128 H595 V158 H665 V128 H700" class="w-p"/><line x1="140" y1="118" x2="140" y2="168" class="start"/><text x="144" y="182" class="lbl">probe file starts</text><text x="62" y="58" class="row" text-anchor="end">nidq</text><text x="62" y="148" class="row" text-anchor="end">probe</text><line x1="175" y1="124" x2="105" y2="72" class="pair-bad"/><line x1="245" y1="124" x2="175" y2="72" class="pair-bad"/><line x1="315" y1="124" x2="245" y2="72" class="pair-bad"/><line x1="455" y1="124" x2="455" y2="72" class="pair-ok"/><line x1="525" y1="124" x2="525" y2="72" class="pair-ok"/><line x1="595" y1="124" x2="595" y2="72" class="pair-ok"/><text x="105" y="102" class="lbl bad">paired by index from the start: off by one edge</text><text x="455" y="102" class="lbl ok">paired from the last edge: correct</text><text x="105" y="28" class="tick" text-anchor="middle">0</text><text x="175" y="28" class="tick" text-anchor="middle">1</text><text x="245" y="28" class="tick" text-anchor="middle">2</text><text x="315" y="28" class="tick" text-anchor="middle">3</text><text x="385" y="28" class="tick" text-anchor="middle">4</text><text x="455" y="28" class="tick" text-anchor="middle">5</text><text x="525" y="28" class="tick" text-anchor="middle">6</text><text x="595" y="28" class="tick" text-anchor="middle">7</text><text x="665" y="28" class="tick" text-anchor="middle">8</text><text x="70" y="210" class="lbl">edge every 0.5 s (1 Hz square wave); one edge missing at the start shifts every spike by 0.5 s</text></svg>